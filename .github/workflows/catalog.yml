name: Generate Atlas Catalog

on:
  push:
    branches: [main]
    paths: ["skills/**","prompts/**","workflows/**","agents/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/generate_catalog.py
      - name: Commit catalog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CATALOG.md
          git diff --cached --quiet || git commit -m "chore: update resource catalog"
          git push
